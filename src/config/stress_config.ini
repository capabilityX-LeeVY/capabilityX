# WebEx RegressShield Stress Testing Configuration
# This file contains thresholds and settings for stress testing monitoring

[stress_thresholds]
# CPU usage threshold (percentage, normalized for Task Manager compatibility)
cpu_threshold = 40.0

# Memory usage threshold (MB)
memory_threshold = 3000

# Hang detection settings
# Available levels: strict, normal, relaxed
# - strict: 30s threshold, more sensitive to performance issues
# - normal: 60s threshold, balanced detection (recommended)
# - relaxed: 120s threshold, fewer false positives for stable environments
hang_detection_level = normal

# Time thresholds for hang detection (in seconds)
hang_threshold_seconds = 60
low_cpu_threshold = 0.1

# Whether to require window unresponsiveness for hang detection
# true = only report hang if window is also unresponsive (recommended)
# false = report hang based on CPU usage alone
require_window_unresponsive_for_hang = true

# Archive settings
archive_interval_seconds = 180
warning_interval_seconds = 60

[monitoring]
# Monitoring interval (seconds)
monitor_interval = 5

# Enable/disable specific monitoring features
enable_crash_detection = true
enable_hang_detection = true
enable_window_responsiveness = true
enable_log_collection = true
enable_performance_warnings = true

[paths]
# Webex logs folder (will use default if empty)
webex_logs_folder = 

# Output folder for collected logs (will use Desktop if empty)
output_folder = 

[reporting]
# Report generation settings
include_screenshots = true
include_process_details = true
color_status_indicators = true

test_suite:
  name: meeting_sharing_settings
  team: Sharing
  owner: gamao
  account: rtuser030
  platform: windows
  language: [en_us]
  check_points: ["Keyboard Navigation"]
  description: Meeting sharing test suite
  test_cases:
    # Pre-conditions: Sign in with rtuser030 and start meeting
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
    - meetings/share/setup_sharing_suite
    - meetings/actions/start_pmr_meeting
    - meetings/share/enable_limit_15_fps_sharing # enable limit 15 fps sharing to make sure share control bar can be captured in screenshot
    
    # Lock and unlock meeting to avoid auto lock in PMR
    - meetings/actions/lock_unlock_meeting
    - meetings/actions/lock_unlock_meeting

    # sharing control bar and settings
    - meetings/share/start_screen_sharing
    - meetings/share/pause_resume_screen_sharing
    - meetings/share/share_something_else_hyperlink
    - meetings/share/more_menu_share_something_else
    - meetings/share/more_menu_share_optimize
    - meetings/share/more_menu_immersive_share
    - meetings/share/more_menu_include_webex
    - meetings/share/sharing_clean_mode
    - meetings/share/give_remote_control
    - meetings/share/presenter_start_annotation
    - meetings/share/sharing_grabbed_by_others
    - meetings/share/sharing_grabbed_when_paused
    - meetings/share/sharing_grabbed_in_clean_mode
    - meetings/share/grab_sharing
    - meetings/share/settings_share

    # Post-conditions
    - meetings/actions/end_meeting_for_all
    - navigations/basic/sign_out
    - navigations/basic/quit_app
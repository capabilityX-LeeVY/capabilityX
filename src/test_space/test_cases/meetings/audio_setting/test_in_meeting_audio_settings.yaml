    - meetings/actions/start_pmr_meeting
  
  steps:
      
    - name: "Unmute in meeting"
      action:
        type: function
        value: ensure_unmuted_in_meeting
      expect_state: ""
      
    - name: "Mute in meeting"
      action:
        type: function
        value: ensure_muted_in_meeting
      expect_state: ""
  
  post_conditions:
    - meetings/actions/end_meeting_for_all
    - navigations/basic/sign_out
  
  execution_duration: 1
  execution_count: 1
  check_points: [Keyboard Navigation, Performance]

test_case:
  name: main_meeting_navigate
  team: RegressShield
  owner: raey
  description: User starts meeting and uses TAB key to traverse through all UI controls systematically.
  expect_result: All meeting controls are accessible via keyboard navigation (TAB/Shift+TAB).
  pre_conditions:
    - navigations/basic/sign_in
    - meetings/actions/start_meeting
  steps:
    - name: "Navigate through all meeting controls"
      action:
        type: loop
        key: tab
        count: 30
        wait_time: 0.5
      expect_state: ""
      ui_response: true
  post_conditions:
     - meetings/actions/end_meeting
     - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_point: [Keyboard Navigation] 
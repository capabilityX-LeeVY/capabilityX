test_case:
  name: share_something_else_hyperlink
  team: Sharing
  owner: jiaxiwan
  account: rtuser030
  description: User opens share dialog by clicking share something else hyperlink button in share control bar.
  expect_result: Share dialog is opened. Focus returns to share control bar after closing share dialog by ESC key.
  pre_conditions:
    - navigations/basic/re-install_app
    - navigations/basic/agree
    - navigations/preconditions/app_entry/sign_in_to_app
    - meetings/actions/start_pmr_meeting
    - meetings/share/start_screen_sharing
  steps:
    - name: "Screen"
      action:
        type: key
        value: default
      expect_state: "Screen or application tab"
      wait_time: 2
    - name: "Direct Escape Key Press"
      action:
        type: key
        value: esc
      expect_state: "Screen"
  post_conditions:
    - meetings/share/stop_screen_sharing
    - meetings/actions/end_meeting
    - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_point: [Keyboard Navigation]


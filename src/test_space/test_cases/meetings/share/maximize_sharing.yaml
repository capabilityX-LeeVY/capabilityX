test_case:
  name: maximize_sharing
  team: Sharing
  owner: jiaxiwan
  account: rtuser030
  description: User can maximize sharing.
  expect_result: User can maximize sharing.
  pre_conditions:
    - navigations/basic/re-install_app
    - navigations/basic/sign_in
    - meetings/actions/start_pmr_meeting
  steps:
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join rtuser030@appletestci.webex.com sharing=on with 1 ucf_api duration 5"
          duration: 120
      expect_state: ""
    - name: "Maximize the shared content"
      action:
        type: key
        value: default
      expect_state: ""
      ai_check:
        prompt: "Analyze the window screenshot. Participant videos should be in the right side bar, separated from the shared content. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"
    - name: "Minimize the shared content"
      action:
        type: key
        value: default
      expect_state: ""
      ai_check:
        prompt: "Analyze the window screenshot. Participant videos should be above the shared content. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"
  post_conditions:
    - meetings/actions/end_meeting_for_all
    - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_point: [Keyboard Navigation]
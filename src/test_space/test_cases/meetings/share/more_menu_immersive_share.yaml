test_case:
  name: more_menu_immersive_share
  team: Sharing
  owner: jiaxiwan
  account: rtuser030
  description: User accesses immersive share options in local share more menu.
  expect_result: Immersive share options are accessible and functional.
  pre_conditions:
    - navigations/basic/re-install_app
    - navigations/basic/agree
    - navigations/preconditions/app_entry/sign_in_to_app
    - meetings/actions/start_pmr_meeting
    - meetings/share/start_screen_sharing
  steps:
    - name: "More sharing options"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Show me in front"
      action:
        type: key
        value: default
        wait_time: 2
      expect_state: "Webex presenter floating window"
      ai_check:
        prompt: "Analyze the desktop screenshot. there’s a self-view “person” video tile overlayed on the shared content, usually at the bottom-right. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"
    - name: "Jump to share control bar"
      action:
        type: shortcut
        value: "Jump to next floating panel"
      expect_state: "More sharing options"
    - name: "Direct Space Key Press"
      action:
        type: direct_key
        value: space
      expect_state: ""
    - name: "Show me in front"
      action:
        type: key
        value: default
      expect_state: "Show me in front"
    - name: "Direct Escape Key Press"
      action:
        type: direct_key
        value: esc
      expect_state: "More sharing options"
  post_conditions:
    - meetings/share/stop_screen_sharing
    - meetings/actions/end_meeting
    - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_point: [Keyboard Navigation]

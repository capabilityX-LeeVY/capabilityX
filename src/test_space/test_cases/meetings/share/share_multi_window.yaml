test_case:
  name: share_multi_window
  team: Sharing
  owner: gamao
  account: rtuser030
  description: User shares multiple windows.
  expect_result: Multiple windows are shared.
  pre_conditions:
    - navigations/basic/re-install_app
    #- navigations/basic/sign_in
    - navigations/preconditions/app_entry/sign_in_to_app
    - meetings/actions/start_pmr_meeting
    - meetings/share/enable_limit_15_fps_sharing # enable limit 15 fps sharing to make sure share control bar can be captured in screenshot
    - meetings/share/switch_window_sharing # switch to window sharing in settings
  steps:
    - name: "open_browser"
      action:
        type: function
        value: open_browser
        params:
          site_url: "https://web.webex.com/sign-in"
        wait_time: 10
      expect_state: ""

    - name: "connect_webex_meeting_main_window"
      action:
        type: function
        value: connect_webex_meeting_main_window
        parameters:
          ctrl_id: "CallWindowDialog"
    - name: "Share"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Webex - rtuser030_FN rtuser030_LN's Personal Room"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Right Key Press"
      action:
        type: direct_key
        value: right
      expect_state: ""
    - name: "Select 2nd window"
      action:
        type: shortcut
        value: "Multi Select"
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 5
      expect_state: ""
      
    # - name: "Direct Tab Key Press"
    #   action:
    #     type: direct_key
    #     value: tab
    #   expect_state: ""
    - name: "Direct Tab Key Press"
      action:
        type: direct_key
        value: tab
      expect_state: "2 windows"
    - name: "Stop sharing (Ctrl + Shift + Z)"
      action:
        type: key
        value: default
        wait_time: 2
      expect_state: ""
    - name: "close_browser"
      action:
        type: function
        value: close_browser
        wait_time: 5
      expect_state: ""
  post_conditions:
    - meetings/actions/end_meeting
    - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_point: [Keyboard Navigation]
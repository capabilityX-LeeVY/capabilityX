test_case:
  name: share_webex_app
  team: Sharing
  owner: jiaxiwan
  account: rtuser030
  description: User shares Webex app.
  expect_result: Webex app is shared.
  pre_conditions:
    - navigations/basic/re-install_app
    - navigations/basic/sign_in
    - meetings/actions/start_pmr_meeting
    - meetings/share/enable_limit_15_fps_sharing # enable limit 15 fps sharing to make sure share control bar can be captured in screenshot
  steps:
    - name: "Share"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Webex and meeting window (2)"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      expect_state: ""
      wait_time: 5
    - name: "Expand my view of what I'm sharing"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 1
      ai_check:
        prompt: "Analyze the window screenshot. Ignore the orange border and the content on the orange background. Only focus on the content in the center of the screenshot. Only Webex app should be visible in the center area. Inside the center area, orange window should also be visible on the top. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"
    - name: "Stop sharing (Ctrl + Shift + Z)"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
  post_conditions:
    - meetings/actions/end_meeting
    - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_point: [Keyboard Navigation]
test_case:
  name: test_basic_screen_sharing
  team: RegressShield
  owner: huanwan3
  account: fullmode18
  description: Complete test - Basic screen sharing workflow. User signs in, starts meeting, shares screen, stops sharing, and signs out.
  expect_result: Successfully completes basic screen sharing workflow
  
  pre_conditions:
    - navigations/basic/re-install_app
    - navigations/basic/sign_in
    - meetings/actions/start_pmr_meeting
  
  steps:
    # Start screen sharing
    - name: "Share"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 1

    - name: "Screen or application tab"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 1

    - name: "Share in share content window"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 10

    # Stop screen sharing
    - name: "Stop sharing (Ctrl + Shift + Z)"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2

    - name: "OK in floating Dialog"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      platforms: ["mac"]
      optional: true
      
  post_conditions:
    - meetings/actions/end_meeting
    - navigations/basic/sign_out 
  
  execution_duration: 1
  execution_count: 1
  check_points: [Keyboard Navigation, Performance]

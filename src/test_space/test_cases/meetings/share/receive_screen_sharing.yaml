test_case:
  name: receive_screen_sharing
  team: Sharing
  owner: jiaxiwan
  account: rtuser030
  description: User receives screen sharing from another participant.
  expect_result: User receives screen sharing from another participant.
  pre_conditions:
    - navigations/basic/re-install_app
    - navigations/basic/sign_in
    - meetings/actions/start_pmr_meeting
  steps:
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join rtuser030@appletestci.webex.com sharing=on with 1 ucf_api duration 8"
          duration: 120
      expect_state: ""
    # add 2nd bot to increase join rate
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join rtuser030@appletestci.webex.com sharing=on with 1 ucf_api duration 5"
          duration: 60
      expect_state: ""
      ai_check:
        prompt: "Analyze the window screenshot. It should display a label indicating that you are viewing someone's screen, with the shared desktop visible in the center of the window. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"
    
  post_conditions:
    - meetings/actions/end_meeting_for_all
    - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_point: [Keyboard Navigation]

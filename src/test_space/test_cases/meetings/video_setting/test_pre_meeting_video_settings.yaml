test_case:
  name: test_pre_meeting_video_settings
  team: RegressShield
  owner: huanwan3
  account: fullmode18
  description: Complete test - Pre-meeting video settings. User signs in, configures video settings before starting meeting, then starts meeting.
  expect_result: Successfully configures video settings before meeting
  
  pre_conditions:
    - navigations/basic/sign_in
    - meetings/actions/pmr_setup
  
  steps:
    - name: "Stop video before meeting"
      action:
        type: function
        value: ensure_video_off_before_meeting
      expect_state: ""
      
    - name: "Start video before meeting"
      action:
        type: function
        value: ensure_video_on_before_meeting
      expect_state: ""
      
    - name: "Stop video before meeting (second test)"
      action:
        type: function
        value: ensure_video_off_before_meeting
      expect_state: ""
      
    - name: "Start video before meeting (final test)"
      action:
        type: function
        value: ensure_video_on_before_meeting
      expect_state: ""
  
  post_conditions:
    - meetings/actions/pmr_start
    - meetings/actions/end_meeting
    - navigations/basic/sign_out
  
  execution_duration: 1
  execution_count: 1
  check_points: [KB_Navigate, Performance]

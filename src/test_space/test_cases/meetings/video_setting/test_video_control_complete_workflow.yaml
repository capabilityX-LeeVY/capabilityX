        value: ensure_video_on_in_meeting
      expect_state: ""
      
    - name: "Stop video in meeting"
      action:
        type: function
        value: ensure_video_off_in_meeting
      expect_state: ""
      
    - name: "Start video in meeting (final test)"
      action:
        type: function
        value: ensure_video_on_in_meeting
      expect_state: ""
  

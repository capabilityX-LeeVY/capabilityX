test_case:
  name: start_meeting
  description: Verify that after signing in, the user can navigate to the Meetings tab, start a personal room meeting successfully and become the host of the meeting.
  expect_result: The user is able to start a personal room meeting and receives a notification indicating they are now the host.
  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
    - navigations/preconditions/app_entry/sign_in_to_app
  steps:
    - name: "Meetings menu item"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Start a Webex meeting"
      action:
        type: key
        value: default
        wait_time: 5
      expect_state: ""
      stop_on_ai_check_failure: true
      ai_check:
        prompt: "Check if the primary action button shows 'Start meeting' or 'Accept'. If you see 'Start meeting' or 'Accept', output only: ✅Success. If you see 'Join meeting' or any other text, output ❌Failed. Reasoning: Button text is '<exact text>'" 
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      optional: true
      ai_check:
        prompt: "Check if the primary action button shows 'Start meeting'. If you see 'Start meeting', output only: ✅Success. If you see 'Join meeting' or any other text, output ❌Failed. Reasoning: Button text is '<exact text>'" 
    - name: "Start meeting"
      action:
        type: key
        value: default
        wait_time: 10
      expect_state: ["Mute","The host or a cohost has turned on reactions in this meeting. Use Ctrl-F6 to read the notification.","View AI Assistant","You're now the host of this meeting. Use Ctrl-F6 to read the notification."]
      ai_check:
        prompt: "Check if the meeting has started successfully. Look for meeting control buttons such as 'Mute', 'Stop video', 'End meeting', or notifications indicating 'You're now the host of this meeting'. If you see these meeting controls or host notification, output only: ✅Success. If you still see 'Connecting...' button or an error message, output only: ❌Failed. Reasoning: <describe what you see and why it failed>" 
  post_conditions: null
  check_points: [Keyboard Navigation, Screen Reader, Focus Ring, Untranslated&Truncated, Performance]

test_case:
  name: guest_join_PMR
  description: Verify that a guest user can successfully join a PMR meeting.
  expect_result: The guest user successfully join a PMR meeting.
  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
  steps:
    - name: "Join a meeting"
      action:
        type: key
        value: default
      expect_state: ""
      ui_response: true
    - name: "Meeting number or link. Required."
      action:
        type: input
        value: cisco.webex.com/meet/minl5
      expect_state: ""
    - name: "Next-Join a meeting - Webex"
      action:
        type: key
        value: default
      expect_state: "Name. Required."
      ui_response: true
      ui_response_threshold_ms: 10000
    - name: "Name. Required."
      action:
        type: input
        value: min
      expect_state: ""
    - name: "Email address. Required."
      action:
        type: input
        value: min@cisco.com
      expect_state: ""
    - name: "Next-Enter your information - Webex"
      action:
        type: key
        value: default
      expect_state: ""
      ui_response: true
      ui_response_threshold_ms: 10000
    - name: "Join meeting"
      action:
        type: key
        value: default
      expect_state: "Mute"
      ui_response: true
      ui_response_threshold_ms: 10000

  post_conditions:
    - navigations/postconditions/end_meeting

  check_points: [Keyboard Navigation, Screen Reader, Focus Ring, Performance]

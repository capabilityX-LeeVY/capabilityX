# File: test_cases/feature_test/Merak_Apptastic/join_meeting/Login_user/not_login_user_join_meeting_from_browser_select_sign_in.yaml
test_case:
  name: not_login_user_join_meeting_from_browser_select_sign_in
  description: "Not login Webex app and keep it active, then start/join meeting from browser and select Sign in from the Webex pre-join page"
  expect_result: "The not-signed-in user launches the meeting from browser to the active Webex app, selects Sign in, and signs in with the weshi2 account"
  owner: minli
  account: weshi2
  check_points: [Keyboard Navigation, Screen Reader, Focus Ring]

  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree

  steps:
    # Step 1: Keep the not-signed-in Webex app active, then open the meeting link in browser
    - name: "Open browser with meeting link"
      platforms: [mac,]
      action:
        type: function
        value: open_browser
        parameters:
          site_url: "https://co.webex.com/co/j.php?MTID=m57fd31d6a72d091f0d2ad5badd947153"
          browser: "safari"
        wait_time: 6

    - name: "Open browser with meeting link"
      platforms: [windows,]
      action:
        type: function
        value: open_browser
        parameters:
          site_url: "https://co.webex.com/co/j.php?MTID=m57fd31d6a72d091f0d2ad5badd947153"
        wait_time: 5

    # Step 2: Allow Safari/browser to open Webex if a permission dialog appears
    - name: "Always Allow"
      platforms: [mac,]
      action:
        type: function
        value: click_macos_button
        parameters:
          process_name: "Safari"
          button_name: "Always Allow,Allow,Open Webex"
          wait_time: 5
          retry: 4
      optional: true

    # Step 3: Click browser launch button variants if they appear
    - name: "Open Webex"
      action:
        type: key
        value: default
        wait_time: 5
      optional: true

    - name: "Open Webex app"
      action:
        type: key
        value: default
        wait_time: 5
      optional: true

    - name: "Launch meeting"
      action:
        type: key
        value: default
        wait_time: 5
      optional: true

    # Step 4: Handle browser dialog to open Webex
    - name: "Open"
      action:
        type: key
        value: default
        wait_time: 5
      optional: true

    # Step 5: Switch focus to Webex pre-join window that contains the Sign in option
    - name: "Connect to Webex app window"
      action:
        type: function
        value: connect_webex_app_main_window
        parameters:
          target_button: "sign in"
          wait_time: 20
        wait_time: 3

    # Step 6: Select Sign in on the pre-join page
    - name: "Sign in  Link If you're the host or have a Webex account, sign in."
      platforms: [windows,]
      action:
        type: key
        value: default
        wait_time: 5

    - name: "Select Sign in from pre-join page"
      platforms: [mac,]
      action:
        type: function
        value: click_macos_button
        parameters:
          process_name: "Webex"
          button_name: "sign in,Sign in,guest sign in"
          wait_time: 5
          retry: 5
        wait_time: 3

    # Step 7: Input weshi2 account email on the "Sign in and join" page
    - name: "Email address"
      action:
        type: input
        value: ${email}

    # Step 8: Continue to password page
    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 15

    - name: "Continue with email"
      action:
        type: key
        value: default
        wait_time: 3
      optional: true

    # Step 9: Input weshi2 account password
    - name: "Password"
      action:
        type: input
        value: ${password}

    # Step 10: Submit sign-in and return to the meeting join flow
    - name: "Sign In, after entering your password"
      action:
        type: key
        value: default
        wait_time: 15

    - name: "Connect to Webex pre-join window"
      platforms: [windows,]
      action:
        type: function
        value: connect_webex_app_main_window
        parameters:
          ctrl_id: "MeetingInterstitialPageView"
        wait_time: 5

    - name: "Join meeting"
      platforms: [windows,]
      action:
        type: key
        value: default
        wait_time: 8

    # Step 11: Switch focus back to the Webex pre-join window with Join meeting button
    - name: "Connect to Webex app window"
      platforms: [mac,]
      action:
        type: function
        value: connect_webex_app_main_window
        parameters:
          target_button: "Join meeting"
          wait_time: 20
        wait_time: 3

    # Step 12: Press Enter to activate the focused Join meeting button
    - name: "Direct Enter Key Press"
      platforms: [mac,]
      action:
        type: direct_key
        value: enter
        wait_time: 8
      ui_response: true
      ui_response_threshold_ms: 10000

  post_conditions:
    - navigations/postconditions/leave_meeting_by_shortcut

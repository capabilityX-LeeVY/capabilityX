test_case:
  name: guest_join_meetingLink_excludesPassword
  description: Webex app is active, click "Join a meeting", then join a meeting by a meeting link without embedded password
  expect_result: The guest user successfully join a meeting by meeting link and enters password separately.
  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
  steps:
    - name: "Join a meeting"
      action:
        type: key
        value: default
      ui_response: true
    - name: "Meeting number or link. Required."
      action:
        type: input
        value: https://co.webex.com/co/j.php?MTID=md467c5a70cf25309d441786b92578dee
    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 6
      
    - name: "Meeting password. Required."
      action:
        type: input
        value: Qu95Agx7XPp

    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 6

    - name: "Name. Required. Textbox"
      action:
        type: input
        value: minl5

    - name: "Join meeting"
      action:
        type: key
        value: default

    - name: "bundle_logs"
      action:
        type: function
        value: bundle_logs
    
    - name: "bundle_logs"
      action:
        type: function
        value: bundle_logs
        
  post_conditions:
    - navigations/postconditions/leave_meeting

  check_points: [Keyboard Navigation]

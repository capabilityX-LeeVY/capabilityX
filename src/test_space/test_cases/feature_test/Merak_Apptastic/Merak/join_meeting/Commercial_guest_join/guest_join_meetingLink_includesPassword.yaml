test_case:
  name: guest_join_meetingLink_includesPassword
  description: Verify that a guest user can successfully join a meeting by a meeting link that includes the password.
  expect_result: The guest user successfully join a meeting by meeting link with embedded password.
  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
  steps:
    - name: "Join a meeting"
      action:
        type: key
        value: default
   
    - name: "Meeting number or link. Required."
      action:
        type: input
        value: https://co.webex.com/co/j.php?MTID=m668e3ebe4723d70d4a5d633d8fe4adf2
    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 6

    - name: "Name. Required. Textbox"
      action:
        type: input
        value: minl5
    - name: "Join meeting"
      action:
        type: key
        value: default

  post_conditions:
    - navigations/postconditions/leave_meeting

  check_points: [Keyboard Navigation]

test_case:
  name: guest_join_InvalidEmail
  description: Verify that a guest user cannot join a meeting using an invalid email address (a@h.h).
  expect_result: The system should display an error message for invalid email format and prevent joining the meeting.
  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
  steps:
    - name: "Join a meeting"
      action:
        type: key
        value: default
      ui_response: true
    - name: "Meeting number or link. Required."
      action:
        type: input
        value: https://appletestci.webex.com/meet/fullmode15
      expect_state: ""
    # - name: "Next-Join a meeting - Webex"
    - name: "Next"
      action:
        type: key
        value: default
      expect_state: "Name. Required."
      ui_response: true
      ui_response_threshold_ms: 10000
    - name: "Name. Required."
      action:
        type: input
        value: TestGuest
      expect_state: ""
    - name: "Email address. Required."
      action:
        type: input
        value: a@h.h
      ui_response: true
      ui_response_threshold_ms: 10000
      ai_check: 
        prompt: "Task: Verify that after entering the invalid email address 'a@h.h', the system properly disables the 'Next' button. Check the following two conditions: 1) The 'Next' button appears grayed out or visually disabled (dimmed appearance, reduced opacity, or gray color indicating disabled state). 2) The 'Next' button is in a disabled/non-clickable state and cannot be activated or pressed. Both conditions must be met for proper validation. If both conditions are satisfied (Next button is visually grayed out AND functionally disabled/non-clickable), output ✅Success. If either condition is not met (button is not grayed out OR button is still clickable), output ❌Failed. Output format: ✅Success or ❌Failed"
    - name: "bundle_logs"
      action:
        type: function
        value: bundle_logs
        
  check_points: [Keyboard Navigation, Screen Reader, Performance]
              
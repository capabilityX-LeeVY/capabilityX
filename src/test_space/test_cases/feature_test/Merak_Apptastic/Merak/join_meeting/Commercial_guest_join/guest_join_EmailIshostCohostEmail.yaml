test_case:
  name: guest_join_EmailIshostCohostEmail
  description: Verify that a guest user join a meeting using the host or cohost's email address.
  expect_result: The guest user joins a meeting，using the host or cohost's email address.
  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
  steps:
    - name: "Join a meeting"
      action:
        type: key
        value: default
        
    - name: "Meeting number or link. Required."
      action:
        type: input
        value: https://appletestci.webex.com/meet/fullmode15
      
    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 8

    - name: "Name. Required."
      action:
        type: input
        value: fullmode15

    - name: "Email address. Required."
      action:
        type: input
        value: fullmode15@appletestci.com

    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 8
      ai_check: 
        prompt: "Task: Check if the screenshot shows the message 'It looks like you're the meeting host or cohost. Sign in to start the meeting' on the page. Carefully examine the screen for this exact text or similar wording indicating that the user is identified as host/cohost and needs to sign in. If this message is visible and clearly displayed, output ✅Success. If the message is not found or the screen shows something different, output ❌Failed. Output format: ✅Success or ❌Failed"

    - name: "bundle_logs"
      action:
        type: function
        value: bundle_logs
        
  check_points: [Keyboard Navigation]

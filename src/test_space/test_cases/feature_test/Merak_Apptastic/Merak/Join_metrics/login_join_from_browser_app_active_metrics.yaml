test_case:
  name: join_from_browser_app_active_metrics
  description: "Verify that a signed-in user can join a meeting from browser while the Webex app is already installed and active, and validate meeting join metrics from Call Analyzer."
  expect_result: The signed-in user successfully joins the meeting from browser (app stays active) and CA metrics show successful join result.
  account: allianz8
  owner: minl5
  check_points: [Keyboard Navigation]

  pre_conditions:
    - navigations/basic/uninstall_app
    - navigations/basic/install_app
    - navigations/basic/agree
    - navigations/basic/sign_in

  steps:
    # --- Open browser and navigate to meeting link ---
    - name: "Open browser with meeting link"
      action:
        type: function
        value: open_browser
        parameters:
          site_url: "https://cisco.webex.com/meet/minl5"
        wait_time: 5

    # --- Handle browser dialog to open Webex ---
    - name: "Open"
      action:
        type: key
        value: default
        wait_time: 8
      optional: true

    # --- Connect to pre-join window (MeetingInterstitialPageView) ---
    - name: "Connect to Webex app window"
      action:
        type: function
        value: connect_webex_app_pre_join_window
        parameters:
          ctrl_id: "MeetingInterstitialPageView"
        wait_time: 10

    # --- Join meeting button on pre-join screen (optional: user may be auto-joined) ---
    - name: "Join meeting"
      action:
        type: key
        value: default
        wait_time: 5

    # --- Metrics Check (before leaving meeting) ---
    - name: "Wait call analyzer data"
      action:
        type: function
        value: ui_element_wait_time
        parameters:
          seconds: 900

    - name: "check_pre_join_result"
      action:
        type: function
        value: get_meeting_join_result
        parameters:
          columns: ["outcome", "resultName", "identifiers_webexSiteName", "failureType"]
        save_to: pre_join_result
      ai_check:
        prompt: "analyze the ${pre_join_result}. Only check the record where resultName='pre.join.result': outcome must be 'success'. Output format: ✅Success or ❌Failed, and briefly state which check failed if any."

    - name: "print pre join result"
      action:
        type: function
        value: print_hello_world
        parameters:
          message: "The pre join result is ${pre_join_result}"

    - name: "check_join_result"
      action:
        type: function
        value: get_meeting_join_result
        parameters:
          columns: ["outcome", "mediaOutcome", "resultName", "joinTimes_totalJmt"]
        save_to: join_result
      ai_check:
        prompt: "analyze the ${join_result}. Only check the record where resultName='join.result': outcome must be 'success' AND mediaOutcome must be 'skipped' (skipped is expected for this scenario where the signed-in user joins from browser with app active). Output format: ✅Success or ❌Failed, and briefly state which check failed if any."

    - name: "print join result"
      action:
        type: function
        value: print_hello_world
        parameters:
          message: "The join result is ${join_result}"

  post_conditions:
    - navigations/postconditions/leave_meeting

test_case:
  name: guest_join_from_browser_next_tab_password_metrics
  description: "Verify that when the Webex desktop client pre-join window is open for a password-protected meeting (but does NOT join), a guest user can open a new browser tab and join the same meeting entirely from the browser, then validate meeting join metrics from Call Analyzer."
  expect_result: The Webex desktop client stays at the pre-join window without joining after the meeting password is entered. A new browser tab opens and the guest successfully joins the same password-protected meeting from the browser. CA metrics show a successful join result.
  account: allianz8
  owner: minl5
  check_points: [Keyboard Navigation]


  steps:
    # --- Kill all browser instances before starting ---
    - name: "Kill all browser instances"
      action:
        type: function
        value: close_browser
        parameters:
          browser: "all"
      wait_time: 2

    # --- Open browser and navigate to password-protected meeting link ---
    - name: "Open browser with meeting link"
      action:
        type: function
        value: open_browser
        parameters:
          site_url: "https://co.webex.com/co/j.php?MTID=m11f5e4b2c9434f53b2beef1a449f6452"
          browser: "edge"
        wait_time: 5

    # --- Focus browser and click Open on the protocol dialog to jump to the desktop client ---
    - name: "Set focus to edge browser for Open dialog"
      action:
        type: function
        value: set_focus_to_edge_browser
        parameters:
          browser: "edge"
          timeout: 5
      wait_time: 1

    - name: "Open"
      action:
        type: function
        value: click_browser_button_by_name
        parameters:
          button_name: "Open"
          browser: "edge"
          timeout: 5
      wait_time: 5

    # --- Connect to Webex app pre-join window ---
    - name: "Connect to Webex app window"
      action:
        type: function
        value: connect_webex_app_main_window
        parameters:
          ctrl_id: "MeetingInterstitialPageView"
        wait_time: 5      

    - name: "Meeting password. Required."
      action:
        type: input
        value: "PHmf23DyiB3"
        wait_time: 5
      optional: true

    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 5
      optional: true

    - name: "Refresh captcha&password"
      action:
        type: key
        value: default
        wait_time: 2
      optional: true

    - name: "Type the characters. Required. &password"
      action:
        type: input
        value: clear_input
      ai_check:
        prompt: "Analyze if there is a image CAPTCHA, if yes, only return the CAPTCHA text shown in the image in lowercase."
      optional: true

    - name: "Type the characters. Required. &password"
      action:
        type: input
        value: "{ai_check_result}"
      optional: true

    - name: "Next"
      action:
        type: key
        value: default
        wait_time: 5
      optional: true

    - name: "Name. Required. Textbox"
      action:
        type: input
        value: minl5

    # --- Open a new browser tab and join the same meeting from browser (client stays at pre-join, does NOT join) ---
    - name: "Open browser new tab to join meeting"
      action:
        type: function
        value: open_browser
        parameters:
          site_url: "https://co.webex.com/co/j.php?MTID=m11f5e4b2c9434f53b2beef1a449f6452"
          browser: "edge"
        wait_time: 5

    # --- Switch focus to the new Edge browser window before interacting with it ---
    - name: "Set focus to edge browser"
      action:
        type: function
        value: set_focus_to_edge_browser
        parameters:
          browser: "edge"
        wait_time: 1

    - name: "Cancel"
      action:
        type: key
        value: default
        wait_time: 3

    - name: "Dismiss Join from browser dialog"
      action:
        type: function
        value: press_escape_key
        parameters:
          browser: "edge"
        wait_time: 3
      optional: true

    - name: "Join from this browser"
      action:
        type: function
        value: click_browser_button_by_name
        parameters:
          button_name: "Join from this browser"
          browser: "edge"
        wait_time: 3
      optional: true

    - name: "Set focus to edge browser for AV dialog"
      action:
        type: function
        value: set_focus_to_edge_browser
        parameters:
          browser: "edge"
          timeout: 10
        wait_time: 1
      optional: true

    - name: "Use microphone and camera"
      action:
        type: function
        value: click_browser_button_by_name
        parameters:
          button_name: "Use microphone and camera"
          browser: "edge"
          timeout: 10
      optional: true

    - name: "Set focus to edge browser for site permission dialog"
      action:
        type: function
        value: set_focus_to_edge_browser
        parameters:
          browser: "edge"
          timeout: 10
        wait_time: 1
      optional: true

    - name: "Allow while visiting the site"
      action:
        type: shortcut
        value: enter
        wait_time: 3
      optional: true

    - name: "Set focus to edge browser for meeting password page"
      action:
        type: function
        value: set_focus_to_edge_browser
        parameters:
          browser: "edge"
          timeout: 10

    - name: "Meeting password"
      action:
        type: input
        value: "PHmf23DyiB3"
        wait_time: 5

    - name: "Move focus to OK"
      action:
        type: shortcut
        value: tab
        wait_time: 1

    - name: "OK"
      action:
        type: shortcut
        value: enter
        wait_time: 3

    - name: "Join meeting"
      action:
        type: function
        value: click_browser_button_by_name
        parameters:
          button_name: "Join meeting"
          browser: "edge"
          timeout: 10
        wait_time: 3
      optional: true

    - name: "Guest user name"
      action:
        type: function
        value: set_browser_input_value
        parameters:
          field_name: "Name"
          text: "minl5"
          browser: "edge"
          timeout: 10
      optional: true

    - name: "Join meeting from browser"
      action:
        type: function
        value: click_browser_button_by_name
        parameters:
          button_name: "Join meeting"
          browser: "edge"
        wait_time: 10
      optional: true

    # --- Wait for Call Analyzer data to be available ---
    - name: "Wait call analyzer data"
      action:
        type: function
        value: ui_element_wait_time
        parameters:
          seconds: 900

    # --- Check pre-join result metrics ---
    - name: "check_pre_join_result"
      action:
        type: function
        value: get_meeting_join_result
        parameters:
          columns: ["outcome", "resultName", "identifiers_webexSiteName", "failureType"]
        save_to: pre_join_result
      ai_check:
        prompt: "analyze the ${pre_join_result}. Only check the record where resultName='pre.join.result': outcome must be 'success'. Output format: [SUCCESS]Success or [FAILURE]Failed, and briefly state which check failed if any."

    - name: "print pre join result"
      action:
        type: function
        value: print_hello_world
        parameters:
          message: "The pre join result is ${pre_join_result}"

    # --- Check join result metrics ---
    - name: "check_join_result"
      action:
        type: function
        value: get_meeting_join_result
        parameters:
          columns: ["outcome", "mediaOutcome", "resultName", "joinTimes_totalJmt"]
        save_to: join_result
      ai_check:
        prompt: "analyze the ${join_result}. Only check the record where resultName='join.result': outcome must be 'success' (the guest joined from a new browser tab for a password-protected meeting while the Webex desktop client pre-join window was open but did not join). Output format: [SUCCESS]Success or [FAILURE]Failed, and briefly state which check failed if any."

    - name: "print join result"
      action:
        type: function
        value: print_hello_world
        parameters:
          message: "The join result is ${join_result}"

    - name: "save correlation ID"
      action:
        type: function
        value: save_current_correlation_id
        save_to: correlation_id

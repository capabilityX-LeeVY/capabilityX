test_case:
  name: sample02
  team: RegressShield
  owner: binbiwan
  description: user start meeting, open video options, change vbg to 'Executive office'.
  expect_result: The vbg is changed to 'Executive office' and the focus is returned to the video options button.
  pre_conditions: null
  steps:
    - name: "Video options"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Change virtual background, Menu item"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Home office"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Save"
      action:
        type: key
        value: default
      expect_state: "Video options"
      ai_check: 
        prompt: "Compare the two images. The first is the reference virtual background, and the second is a meeting screenshot with a virtual background applied. Ignore any people or foreground elements in the images. Focus only on the background. Determine if the background in the second image matches the reference background in the first. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"
        reference: src/test_space/datasets/img/vbg/execute_office.jpg
  post_conditions:
    - meetings/actions/end_meeting
    - navigations/basic/sign_out
  execution_duration: 1
  execution_count: 1
  check_points: [KB_Navigate, Performance]
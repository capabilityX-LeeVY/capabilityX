test_case:
  name: sample04
  team: RegressShield
  owner: binbiwan
  description: user start meeting, open video options, change vbg to 'Home office'.
  expect_result: The vbg is changed to 'Home office' and the focus is returned to the video options button.
  pre_conditions:
    - navigations/basic/sign_in
    - meetings/actions/start_meeting
  steps:
    - name: "Video options"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Change virtual background, Menu item"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Home office"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Save"
      action:
        type: key
        value: default
      expect_state: "Video options"
      ai_check: 
        prompt: "Compare these two images and determine if the virtual background in the second matches the first (reference)."
        reference: src/test_space/datasets/img/vbg/home_office.jpg
  post_conditions:
    - meetings/actions/end_meeting
    - navigations/basic/sign_out
  execution_duration: 30
  execution_count: 2
  check_points: [KB_Navigate, Performance]

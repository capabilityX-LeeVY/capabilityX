test_case:
  name: vdi_meeting_video_layout_switching
  team: VDI
  owner: qihliu
  account: allianz32
  description: Complete test - Comprehensive layout switching functionality. User joins meeting, then tests all layout switching scenarios.
  expect_result: Successfully tests all layout switching scenarios
  
  pre_conditions:
    #- navigations/basic/re-install_app
    - navigations/basic/relaunch_app
    - navigations/basic/sign_in
    - VDI/healthchecker/vdi_healthchecker
    - meetings/actions/start_pmr_meeting

  steps:
    # add bot to meeting to test layout
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join allianz32@testprod.webex.com audio=off video=on with 2 ucf_api duration 3"
          duration: 120
      expect_state: ""

    - name: "F6"
      action:
        type: shortcut
        value: "f6"
        
    - name: "F6"
      action:
        type: shortcut
        value: "f6"

    - name: "Layout"
      action:
        type: key
        value: default
    
    - name: "Side by side"
      action:
        type: key
        value: default

    - name: "vdi_read_tc_ip"
      action:
        type: function
        value: vdi_read_tc_ip
        save_to: tc_ip
        wait_time: 1
      expect_state: ""

    - name: "vdi_get_screenshot"
      action:
        type: function
        value: vdi_get_screenshot
        parameters:
          tc_ip: "${tc_ip}"
        wait_time: 2
      expect_state: ""

    - name: "vdi_open_screenshot"
      action:
        type: function
        value: vdi_open_screenshot
        wait_time: 2
      expect_state: ""
      stop_on_failure: true      
      stop_on_ai_check_failure: true      
      ai_check:
        prompt: "Analyze the window screenshot. There is not fully grey or blank meeting or conversation window that has window title <someone's Personal Room - VDI>. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"

    - name: "Mini active app"
      action:
        type: shortcut
        value: "Mini active app"
        wait_time: 1
      expect_state: ""

    - name: "Layout"
      action:
        type: key
        value: default
    
    - name: "Stack"
      action:
        type: key
        value: default

    - name: "vdi_get_screenshot"
      action:
        type: function
        value: vdi_get_screenshot
        parameters:
          tc_ip: "${tc_ip}"
        wait_time: 2
      expect_state: ""

    - name: "vdi_open_screenshot"
      action:
        type: function
        value: vdi_open_screenshot
        wait_time: 2
      expect_state: ""
      stop_on_failure: true      
      stop_on_ai_check_failure: true      
      ai_check:
        prompt: "Analyze the window screenshot. There is not fully grey or blank meeting or conversation window that has window title <someone's Personal Room - VDI>. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"

    - name: "Mini active app"
      action:
        type: shortcut
        value: "Mini active app"
        wait_time: 1
      expect_state: ""

    - name: "Layout"
      action:
        type: key
        value: default
    
    - name: "Grid"
      action:
        type: key
        value: default

    - name: "vdi_open_screenshot"
      action:
        type: function
        value: vdi_open_screenshot
        wait_time: 2
      expect_state: ""
      ai_check:
        prompt: "Analyze the window screenshot. There is not fully grey or blank meeting or conversation window that has window title <someone's Personal Room - VDI>. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"

    - name: "Mini active app"
      action:
        type: shortcut
        value: "Mini active app"
        wait_time: 120
      expect_state: ""
 
  post_conditions:
    - meetings/actions/end_meeting_for_all
    - navigations/basic/sign_out
    
  execution_duration: 1
  execution_count: 1
  retry_enabled: false
  check_points: ["Keyboard Navigation"]

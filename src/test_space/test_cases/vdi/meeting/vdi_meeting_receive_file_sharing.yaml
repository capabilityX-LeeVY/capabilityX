test_case:
  name: vdi_meeting_receive_file_sharing
  team: VDI
  owner: qihliu
  account: allianz32
  description: Complete test - File sharing workflow. User signs in, starts meeting, file share, stops sharing, and signs out.
  expect_result: Successfully completes file share workflow
  
  pre_conditions:
    #- navigations/basic/re-install_app
    - navigations/basic/relaunch_app
    - navigations/basic/sign_in
    - VDI/healthchecker/vdi_healthchecker
    - meetings/actions/start_pmr_meeting
  
  steps:
    # Receive file sharing
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join allianz32@testprod.webex.com audio=off video=on sharing=file location=sjc with 1 ucf_api duration 2"
          duration: 90
      expect_state: ""
      stop_on_failure: true      
      stop_on_ai_check_failure: true      
      ai_check:
        prompt: "Analyze the window screenshot. It should display a label indicating that you are viewing someone's <file name> and recieved file sharing content is not fully black or blank area in the meeting window. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"      

    - name: "Shared file view"
      action:
        type: key
        value: default
        wait_time: 90
      expect_state: ""

  post_conditions:
    - meetings/actions/end_meeting
    - navigations/basic/sign_out 
  
  execution_duration: 1
  execution_count: 1
  retry_enabled: false  
  check_points: ["Keyboard Navigation"]

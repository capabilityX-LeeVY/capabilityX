test_case:
  name: vdi_meeting_start_annotation
  team: VDI
  owner: qihliu
  account: bwc.sha+100
  description: Complete test - Basic screen sharing workflow. User signs in, starts meeting, shares screen, start annotaion, stop annotation, stops sharing, and signs out.
  expect_result: Successfully completes basic annotation workflow
  
  pre_conditions:
    #- navigations/basic/re-install_app
    - navigations/basic/relaunch_app
    - navigations/basic/sign_in
    - VDI/healthchecker/vdi_healthchecker
    - meetings/actions/start_pmr_meeting
    - VDI/meeting/vdi_meeting_start_screen_sharing
  
  steps:
    # Start Annotation
    - name: "More sharing options"
      action:
        type: key
        value: default
      expect_state: ""
      
    - name: "Annotate"
      action:
        type: key
        value: default
      expect_state: ""
      
    - name: "Cursor"
      action:
        type: key
        value: default
        wait_time: 3        
      expect_state: ""
      
    - name: "Stop annotating"
      action:
        type: key
        value: default
      expect_state: ""
      
    - name: "Stop annotation"
      action:
        type: key
        value: default
      expect_state: ""

    # Stop screen sharing
    - name: "Stop sharing (Ctrl + Shift + Z)"
      action:
        type: key
        value: default
        wait_time: 2
      expect_state: ""

      
  post_conditions:
    - meetings/actions/end_meeting
    - navigations/basic/sign_out 
  
  execution_duration: 1
  execution_count: 1
  check_points: ["Keyboard Navigation"]

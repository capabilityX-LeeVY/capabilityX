test_case:
  name: vdi_start_pmr_meeting
  owner: qihliu
  description: User starts a Personal Room meeting by navigating through the meetings tab and selecting the PMR option.
  expect_result: The user successfully starts a Personal Room meeting.
  pre_conditions: []
  steps:
    - name: "Meetings menu item"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true

    - name: "vdi_read_tc_ip"
      action:
        type: function
        value: vdi_read_tc_ip
        save_to: tc_ip
        wait_time: 1
      expect_state: ""
    - name: "vdi_get_screenshot"
      action:
        type: function
        value: vdi_get_screenshot
        parameters:
          tc_ip: "${tc_ip}"
        wait_time: 5
      expect_state: ""
    - name: "vdi_open_screenshot"
      action:
        type: function
        value: vdi_open_screenshot
        wait_time: 2
      expect_state: ""
      ai_check: 
        prompt: "Analyzing window screenshot, local preview in the window named as <someone`s personal room> should not be fully grey or blank video . Output: ✅Success or ❌Failure. Reasoning: <short explanation>"
    - name: "Mini active app"
      action:
        type: shortcut
        value: "Mini active app"
        wait_time: 1
      expect_state: ""

    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5
  post_conditions: []
  execution_duration: 1
  execution_count: 1
  check_points: [Keyboard Navigation, Performance]

test_case:
  name: vdi_meeting_receive_reactions
  team: VDI
  owner: qihliu
  account: allianz32
  description: User receives screen sharing from another participant.
  expect_result: User receives screen sharing from another participant.

  pre_conditions:
    #- navigations/basic/re-install_app
    - navigations/basic/relaunch_app
    - navigations/basic/sign_in
    - VDI/healthchecker/vdi_healthchecker
    - meetings/actions/start_pmr_meeting

  steps:
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join allianz32@testprod.webex.com audio=off video=off location=sjc send_reactions=on with 1 ucf_api duration 2"
          duration: 90
      expect_state: ""
      stop_on_failure: true

    - name: "vdi_read_tc_ip"
      action:
        type: function
        value: vdi_read_tc_ip
        save_to: tc_ip
        wait_time: 1
      expect_state: ""

    - name: "vdi_get_screenshot"
      action:
        type: function
        value: vdi_get_screenshot
        parameters:
          tc_ip: "${tc_ip}"
        wait_time: 1
      expect_state: ""

    - name: "vdi_open_screenshot"
      action:
        type: function
        value: vdi_open_screenshot
        wait_time: 2
      expect_state: ""
      ai_check:
        prompt: "Analyze the window screenshot in Paint. A emoji reaction is clearly visible in the meeting window, confirming that the reaction is displayed as intended. Output: ✅Success or ❌Failure. Reasoning: <short explanation>"

    - name: "Mini active app"
      action:
        type: shortcut
        value: "Mini active app"
        wait_time: 70
      expect_state: ""
    
  post_conditions:
    - meetings/actions/end_meeting_for_all
    - navigations/basic/sign_out

  execution_duration: 1
  execution_count: 1
  retry_enabled: false  
  check_point: ["Keyboard Navigation"]

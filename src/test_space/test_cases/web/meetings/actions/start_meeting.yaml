test_case:
  name: start_meeting
  custom_dataset: control_datasets_webex_app_web
  description: Verify that after signing in, the user can navigate to the Meetings tab, start a personal room meeting successfully and become the host of the meeting.
  expect_result: The user is able to start a personal room meeting and receives a notification indicating they are now the host.
  steps:
    - name: "Meetings menu item"
      action:
        type: key
        value: default
      expect_state: ""

    - name: "Start a meeting"
      action:
        type: key
        value: default
      expect_state: ""

    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      optional: true

    - name: "Start meeting"
      action:
        type: key
        value: default
        wait_time: 5
      expect_state: ""
  check_points: [KB, SR, FR, Untranslated&Truncated, Performance]

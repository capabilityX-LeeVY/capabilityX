test_case:
  name: guest_join_pmr
  owner: weiqli
  description: User joins a Personal Room meeting as a guest.
  expect_result: The user successfully joins a Personal Room meeting.
  continue_on_error: true
  pre_conditions: []
  steps:
    - name: "Relaunch Webex application"
      action:
        type: function
        value: relaunch_app
    - name: "Join a meeting"
      action:
        type: key
        value: default
    - name: "Meeting number or link. Required."
      action:
        type: input
        value: "weiqin6.cvgbts.converged-bts@webex.com"
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 10
    - name: "Name. Required."
      action:
        type: input
        value: clear_input
      optional: true
    - name: "Name. Required."
      action:
        type: input
        value: "Guest User"
      optional: true
      ai_check:
        prompt: "Analyze if there is a image CAPTCHA, if yes, only return the CAPTCHA text shown in the image."
    - name: "Type the characters. Required."
      action:
        type: input
        value: "{ai_check_result}"
      optional: true
    - name: "Next"
      action:
        type: key
        value: default
      wait_time: 2
    - name: "Type the characters. Required."
      action:
        type: input
        value: clear_input
      ai_check:
        prompt: "Analyze if there is a image CAPTCHA, if yes, only return the CAPTCHA text shown in the image in lowercase."
      optional: true
    - name: "Type the characters. Required."
      action:
        type: input
        value: "{ai_check_result}"
      optional: true
    - name: "Next"
      action:
        type: key
        value: default
      optional: true
    - name: "Type the characters. Required."
      action:
        type: input
        value: clear_input
      ai_check:
        prompt: "Analyze if there is a image CAPTCHA, if yes, only return the CAPTCHA text shown in the image in lowercase."
      optional: true
    - name: "Type the characters. Required."
      action:
        type: input
        value: "{ai_check_result}"
      optional: true
    - name: "Next"
      action:
        type: key
        value: default
      optional: true
    - name: "Accept"
      action:
        type: key
        value: default
      optional: true
    - name: "Join meeting"
      action:
        type: key
        value: default
      expect_state: ["Mute","The host or a cohost has turned on reactions in this meeting. Use Ctrl-F6 to read the notification.","View AI Assistant","You're now the host of this meeting. Use Ctrl-F6 to read the notification."]
      ui_response: true
    - name: "Leave meeting button"
      action:
        type: key
        value: default
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 5
  post_conditions: []
  execution_duration: 1
  execution_count: 70
  check_points: [Keyboard Navigation, Performance]
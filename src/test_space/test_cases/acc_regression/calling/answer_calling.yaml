test_case:
  name: answer_calling
  team: RegressShield
  owner: binbiwan
  description: user start calling, anwser calling success.
  expect_result: traverse acc for calling window.
  pre_conditions: null
  steps:
    - name: "call agent"
      action: 
        type: api
        value: "run_calling_functions_api"
        agent_node: "calling_agent_01"
        wait_time: 20
      ai_check:
        prompt: "Analyze if 'Start a calling' was successful. Check: 1) Is 'calling...' text visible? 2) Are Mute, Share, Keypad, More buttons present? 3) Is there a blue focus ring on Mute button? Output format: If call connected (no 'calling...' text, all buttons present, blue focus ring on Mute), respond '✅Success. Call connected with all controls and focus ring on Mute.' If still connecting ('calling...' visible), respond '⏳Connecting. Call in progress.' If failed or missing elements, respond '❌Failed. [What's wrong].' Only output emoji and 1 sentences."
  execution_duration: 1
  execution_count: 1
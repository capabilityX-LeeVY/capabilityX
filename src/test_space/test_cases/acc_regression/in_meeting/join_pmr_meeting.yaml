test_case:
  name: guest_join_pmr
  owner: faye
  account: bts1
  description: User joins a Personal Room meeting as an attendee from Meetings search.
  expect_result: The user successfully joins a Personal Room meeting.
  continue_on_error: true
  pre_conditions: null
  steps:
    - name: "Join a meeting in meetings tab"
      action:
        type: key
        value: default
    - name: "Enter the meeting information"
      action:
        type: input
        value: "https://testprod.webex.com/meet/allianz31"
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
    - name: "Accept"
      action:
        type: key
        value: default
      optional: true
    - name: "Join meeting"
      action:
        type: key
        value: default
      expect_state: ["Mute","The host or a cohost has turned on reactions in this meeting. Use Ctrl-F6 to read the notification.","View AI Assistant","You're now the host of this meeting. Use Ctrl-F6 to read the notification."]
      ui_response: true
  post_conditions: []
  execution_duration: 1
  check_points: [Keyboard Navigation]
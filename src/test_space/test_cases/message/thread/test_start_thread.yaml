test_case:
  name: start_thread
  owner: huanwan3
  account: fullmode18
  description: Send a message and start a thread reply on it
  expect_result: Thread is successfully created with reply message visible under the original message
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    # Use common action to send text message
    - include: message/actions/send_text_message
      params:
        message_text: "Test message for thread [uuid:{uuid}]"

    # Use common action to open context menu on last message
    - include: message/actions/open_message_context_menu

    # Navigate down to "Start a Thread" (3rd item in menu)
    # Menu order: Copy message, Edit message, Start a Thread
    - include: message/actions/navigate_menu_down
      params:
        count: 2

    # Select "Start a Thread"
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 2
      expect_state: ""

    # Type thread reply message
    - name: "Type thread reply"
      action:
        type: direct_input
        value: "Thread reply [uuid:{uuid}]"
        wait_time: 1
      expect_state: ""


    - name: "Click Send button"
      action:
        type: direct_key
        value: enter
        wait_time: 3
      expect_state: ""
      ai_check:
        prompt: "Look at the chat window. Check if there is a thread reply visible under a message. The thread should show: 1) A reply message with indentation under the original message, 2) 'Reply' and 'Collapse' buttons visible. Output format: ✅Success if thread reply is visible with Reply/Collapse buttons, ❌Failed if no thread structure found"

  post_conditions:
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

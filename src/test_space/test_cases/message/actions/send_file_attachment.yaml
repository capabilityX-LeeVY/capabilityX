test_case:
  name: send_file_attachment
  owner: huanwan3
  account: fullmode18
  description: Common action to send a file attachment using Ctrl+O shortcut
  expect_result: File attachment is sent successfully
  pre_conditions: []

  steps:
    # Open file selection dialog with Ctrl+O
    - name: "Open file dialog"
      action:
        type: shortcut
        value: ctrl+o
        wait_time: 2
      expect_state: ""

    # Input test file path (cross-platform dynamic path)
    - name: "Input file path"
      action:
        type: function
        value: select_test_file
        params:
          file_name: "{file_type}"
        wait_time: 1
      expect_state: ""

    # Confirm file selection
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 2
      expect_state: ""

    # Send file
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 5
      expect_state: ""

  post_conditions: []
  check_point: [Keyboard Navigation]

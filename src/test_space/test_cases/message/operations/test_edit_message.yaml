test_case:
  name: edit_message
  owner: huanwan3
  account: fullmode18
  description: Verify message editing functionality, using UUID to uniquely identify the edited message
  expect_result: Message successfully edited and displayed in chat window with unique UUID identifier
  pre_conditions: 
      - navigations/basic/sign_in
      - message/actions/init_sending_message

  steps: 
    # Use common action to send initial message
    - include: message/actions/send_text_message
      params:
        message_text: "Hello World"
 
    - name: "Edit last message"
      action:
        type: shortcut
        value: shift+up
        wait_time: 2
      expect_state: ""

    - name: "Direct Input"
      action:
        type: direct_input
        value: " updated message [uuid:{uuid}]"
        wait_time: 2
      expect_state: ""

    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 3
      expect_state: ""
      ai_check:
        prompt: "Verify message editing. The LAST message (bottom-most) in chat area must contain exactly: 'Hello World updated message [uuid:{uuid}]'. The input box should be empty (placeholder text is OK). If the last message matches this exact UUID, output: ✅Success. Otherwise: ❌Failed."
      
  post_conditions: 
      - navigations/basic/sign_out_shortcut

  check_point: [Keyboard Navigation]
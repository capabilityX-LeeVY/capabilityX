test_case:
  name: add_reaction
  owner: huanwan3
  account: fullmode18
  description: Send a message and add a reaction to it using context menu
  expect_result: Reaction is successfully added to the message
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    # Use common action to send text message
    - include: message/actions/send_text_message
      params:
        message_text: "Test message for reaction [uuid:{uuid}]"

    # Use common action to open context menu on last message
    - include: message/actions/open_message_context_menu

    # Navigate down to "Add reaction" (4th item in menu)
    # Menu order: Copy message, Edit message, Start a Thread, Add reaction
    - include: message/actions/navigate_menu_down
      params:
        count: 3

    # Open reaction submenu (press Enter or Right)
    - name: "Open reaction submenu"
      action:
        type: direct_key
        value: enter
        wait_time: 1
      expect_state: ""

    # Select first reaction (thumbs up or similar)
    - name: "Select reaction"
      action:
        type: direct_key
        value: enter
        wait_time: 2
      expect_state: ""

    # Focus back to message input for screenshot and AI check
    - name: "Focus on message input"
      action:
        type: shortcut
        value: ctrl+alt+i
        wait_time: 3
      expect_state: ""
      ai_check:
        prompt: "Look at the chat window. Check if a reaction (emoji like thumbs up, heart, celebrate, or similar) has been added to the message. Look for a small emoji icon appearing below or next to the message. Output format: ✅Success if a reaction emoji is visible on the message, ❌Failed if no reaction found"

  post_conditions:
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

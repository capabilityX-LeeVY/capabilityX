test_case:
  name: send_video
  owner: huanwan3
  account: fullmode18
  description: Send a video in message chat using Ctrl+O shortcut
  expect_result: Video is successfully sent in the chat conversation
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    # Send video and verify with AI check
    - include: message/actions/send_file_attachment
      params:
        file_type: video
      ai_check:
        prompt: "Look at the chat window and check the last message. Determine if the last message contains a video (showing a video thumbnail, video preview, video player, or video file like 'test_video.mp4'). Output format: ✅Success if the last message contains a video, ❌Failed if no video found"

  post_conditions:
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

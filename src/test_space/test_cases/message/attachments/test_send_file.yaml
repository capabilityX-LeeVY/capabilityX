test_case:
  name: send_file
  owner: huanwan3
  account: fullmode18
  description: Send a file in message chat using Ctrl+O shortcut
  expect_result: File is successfully sent in the chat conversation
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    # Send file attachment and verify with AI check
    - include: message/actions/send_file_attachment
      params:
        file_type: document
      ai_check:
        prompt: "Look at the chat window and check the last message. Determine if the last message contains a file attachment (showing a file icon, file name like 'test_document.txt', or a downloadable file card). Output format: ✅Success if the last message contains a file attachment, ❌Failed if no file found"

  post_conditions:
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

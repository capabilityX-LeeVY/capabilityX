test_case:
  name: send_pmr_invite
  owner: huanwan3
  account: fullmode18
  description: Send a personal room invite in message chat using the PMR URL button
  expect_result: Personal room invite link is successfully sent in the chat conversation
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    - name: "Click PMR URL button"
      action:
        type: function
        value: click_pmr_url
        wait_time: 2
      expect_state: ""

    # send PMR invite
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 5
      expect_state: ""
      ai_check:
        prompt: "Look at the chat window and check the last message. Determine if the last message contains a Webex personal room meeting link or meeting card. Look for: 1) A URL containing 'appletestci.webex.com/meet/fullmode18', OR 2) A meeting invitation card with 'fullmode18' in it, OR 3) A clickable meeting link. Output format: ✅Success if any of these are found in the last message, ❌Failed if none are found"

  post_conditions: 
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

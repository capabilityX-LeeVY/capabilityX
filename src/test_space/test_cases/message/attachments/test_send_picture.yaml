test_case:
  name: send_picture
  owner: huanwan3
  account: fullmode18
  description: Send a picture in message chat using Ctrl+O shortcut
  expect_result: Picture is successfully sent in the chat conversation
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    # Send picture and verify with AI check
    - include: message/actions/send_file_attachment
      params:
        file_type: image
      ai_check:
        prompt: "Look at the chat window and check the last message. Determine if the last message contains an image (showing a picture thumbnail, image preview, or image file like 'test_image.png'). Output format: ✅Success if the last message contains an image, ❌Failed if no image found"

  post_conditions:
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

test_case:
  name: send_screen_capture
  owner: huanwan3
  account: fullmode18
  description: Send a screen capture in message chat using the Screen capture button
  expect_result: Screen capture is successfully sent in the chat conversation
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    - name: "Click Screen capture button"
      action:
        type: function
        value: click_screen_capture
        wait_time: 2
      expect_state: ""

    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 1
      expect_state: ""

    # send screen capture
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 5
      expect_state: ""
      ai_check:
        prompt: "Look at the chat window and check the last message. Determine if the last message contains a screen capture/screenshot image (not text). A screen capture typically shows desktop content, application windows, or UI elements. Output format: ✅Success if the last message is a screenshot image, ❌Failed if it's text or no image found"

  post_conditions: 
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

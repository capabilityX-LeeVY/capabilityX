test_case:
  name: copy_space_link
  owner: huanwan3
  account: fullmode18
  description: Create a new space and copy its link
  expect_result: Space link is successfully copied to clipboard

  pre_conditions:
    - navigations/basic/sign_in

  steps:
    # Create a new space first
    - include: message/actions/create_space

    # Click Space settings menu button
    - name: "Click Space settings menu"
      action:
        type: function
        value: click_space_settings
        wait_time: 2
      expect_state: ""

    # Navigate down once to "Copy space link" option
    - name: "Navigate to Copy space link"
      action:
        type: direct_key
        value: down
        wait_time: 1
      expect_state: ""

    # Press Enter to copy the link
    - name: "Copy space link"
      action:
        type: direct_key
        value: enter
        wait_time: 2
      expect_state: ""

    # Paste to verify the link was copied (focus on message input first)
    - name: "Focus on message input"
      action:
        type: shortcut
        value: ctrl+alt+i
        wait_time: 1
      expect_state: ""

    # Paste the copied link
    - name: "Paste copied link"
      action:
        type: shortcut
        value: ctrl+v
        wait_time: 2
      expect_state: ""

    - name: "Send message"
      action:
        type: direct_key
        value: enter
        wait_time: 3
      expect_state: ""
      ai_check:
        prompt: "Look at the chat conversation area. Check if a space link has been sent as the last message. The link should appear as a clickable blue text showing the space name (like 'test space [timestamp]'). Output format: ✅Success if a clickable space name link is visible as the last message, ❌Failed if no link was sent"

  post_conditions:
    - navigations/basic/sign_out_shortcut

  check_points: ["Keyboard Navigation"]

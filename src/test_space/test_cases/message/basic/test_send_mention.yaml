test_case:
  name: send_mention
  owner: huanwan3
  account: fullmode18
  description: Send a mention in message chat using the Mention button
  expect_result: Mention is successfully sent in the chat conversation
  pre_conditions:
    - navigations/basic/sign_in
    - message/actions/init_sending_message

  steps:
    - name: "Click Mention button"
      action:
        type: function
        value: click_mention
        wait_time: 2
      expect_state: ""

    - name: "Direct Input"
      action:
        type: direct_input
        value: "fullmode18"
        wait_time: 1
      expect_state: ""

    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 1
      expect_state: ""

    # send mention message
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
        wait_time: 1
      expect_state: ""
      ai_check:
        prompt: "Look at the chat window and check the last message. Determine if the last message contains a mention link with the name 'fullmode18_FN's space' (a clickable link typically shown in blue color). Output format: ✅Success if the last message contains a link named 'fullmode18_FN's space', ❌Failed if no such link found"

  post_conditions: 
    - navigations/basic/sign_out_shortcut
  check_point: [Keyboard Navigation]

test_case:
  name: send_message
  owner: huanwan3
  account: fullmode18
  description: Verify message sending functionality, using UUID to uniquely identify the sent message
  expect_result: Message successfully sent and displayed in chat window with unique UUID identifier
  pre_conditions: 
      - navigations/basic/sign_in
      - message/actions/init_sending_message

  steps: 
    # Send text message and verify with AI check
    - include: message/actions/send_text_message
      params:
        message_text: "Hello World [uuid:{uuid}]"
      ai_check:
        prompt: "Verify message sending. The LAST message (bottom-most) in chat area must contain exactly: 'Hello World [uuid:{uuid}]'. The input box should be empty (placeholder text is OK). If the last message matches this exact UUID, output: ✅Success. Otherwise: ❌Failed."

  post_conditions: 
      - navigations/basic/sign_out_shortcut

  check_point: [Keyboard Navigation]
test_case:
  name: sanity_audio_only_mac
  owner: gamao
  account: bts13
  description: Performance test for audio-only meeting - tests meeting with audio enabled and video disabled
  expect_result: Successfully starts meeting with audio only, measures performance metrics
  pre_conditions:
     - navigations/basic/re-install_app
    # - navigations/basic/agree
     - navigations/basic/sign_in
    
  steps: 
  # setup pmr
    - name: "Meetings menu item"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true

    - name: "Stop video"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true

    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5

    - name: "End meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2

    - name: "End meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2

#Start meeting
    # - name: "Meetings menu item"
    #   action:
    #     type: key
    #     value: default
    #   expect_state: ""
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true
    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5

    # Add bot
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join bts13@converged-bts.webex.com audio=on video=off with 1 ucf_api duration 15"
          duration: 120
      expect_state: ""

    - name: "change case name for telegraf"
      action:
        type: function
        value: replace_txt_file
        parameters:
          file_path: "~/Desktop/teamsCallingCpuMonitor_caseName.txt"
          content: "audioOnlyTest"
      expect_state: ""
    
    # start telegraf
    - name: "open local background process and run command"
      action:
        type: function
        value: open_background_process_and_run_command
        parameters:
          command: "telegraf -config ~/telegraf.conf"
        save_to: terminal_session_id
      expect_state: ""

    # - name: "connect_webex_meeting_main_window"
    #   action:
    #     type: function
    #     value: connect_webex_meeting_main_window
    #     parameters:
    #       ctrl_id: "CallWindowDialog"

    - name: "Wait exactly 360 seconds"
      action:
        type: function
        value: ui_element_wait_time
        parameters:
          seconds: 360
      expect_state: ""

    # end telegraf
    - name: "close background process"
      action:
        type: function
        value: close_background_process_session
        parameters:
          session_id: "${terminal_session_id}"

    - name: "restore case name for telegraf"
      action:
        type: function
        value: replace_txt_file
        parameters:
          file_path: "~/Desktop/teamsCallingCpuMonitor_caseName.txt"
          content: "Default"
      expect_state: ""

    # ── WME Thread Anomaly Monitoring ──
    # Run AFTER the 360s telegraf window so xctrace recording does not
    # contend with telegraf's sampling. start_wme_thread_monitor returns
    # immediately after spawning the detached xctrace recorder (45s) +
    # analyzer; finalize_wme_thread_monitor below blocks until analysis
    # completes and then asserts on anomalies.
    - name: "start wme thread anomaly monitor (45s xctrace, runs in parallel)"
      action:
        type: function
        value: start_wme_thread_monitor
        parameters:
          duration: "45s"
          label: "sanity_audio_only_mac"
          target_process: "Webex"
        save_to: wme_thread_session_id
      expect_state: ""

    # Join the WME thread monitor result. Fails the case on
    # CRITICAL/HIGH anomalies; PASS auto-cleans the run dir.
    - name: "finalize wme thread monitor (assert no CRITICAL/HIGH anomalies)"
      action:
        type: function
        value: finalize_wme_thread_monitor
        parameters:
          session_id: "${wme_thread_session_id}"
          fail_on: ["CRITICAL", "HIGH"]
          wait_timeout: 240
      expect_state: ""

    # The in-meeting toolbar (Mute / End meeting / etc.) auto-hides after
    # ~5s of no input. After 360s of telegraf monitoring it is hidden and
    # only mouse movement on the meeting window can wake it; keyboard
    # focus changes (Tab) do NOT. Bypass the toolbar entirely by invoking
    # Webex's "Leave or end the meeting or call" shortcut (Cmd+L), which
    # opens the End-meeting modal directly. Down + Enter then navigates
    # from the default Cancel focus to End meeting and confirms.
    - name: "open end-meeting modal via Cmd+L (bypasses auto-hidden toolbar)"
      action:
        type: shortcut
        value: "Leave or end the meeting or call"
      wait_time: 4
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""

  post_conditions:
     - navigations/basic/sign_out
     - navigations/basic/quit_app

  execution_duration: 1
  execution_count: 1
  check_points: ["Keyboard Navigation", "Performance"]

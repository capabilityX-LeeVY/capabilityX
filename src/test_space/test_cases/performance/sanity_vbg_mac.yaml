test_case:
  name: sanity_vbg_mac
  owner: gamao
  account: bts13
  description: Performance test for vbg video meeting - tests meeting with video enabled with vbg and audio disabled
  expect_result: Successfully starts meeting with vbg, measures performance metrics
  pre_conditions:
     - navigations/basic/re-install_app
    # - navigations/basic/agree
     - navigations/basic/sign_in
    
  steps: 
  # setup pmr
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true

    - name: "Mute"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true

    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5

  # setup vbg
    - name: "Video options"
      action:
        type: key
        value: default
      expect_state: ""
    # - name: "Change virtual background"
    #   action:
    #     type: key
    #     value: default
    #   expect_state: ""
    #  this step will select the next option in video options, looks like a bug.

    - name: "Video Settings..., Menu item"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: "Background"
    - name: "Direct Arrow Tab Key Press"
      action:
        type: direct_key
        value: tab
      expect_state: "None virtual background"
    
    - name: "Home office"
      action:
        type: key
        value: default
      expect_state: ""

    - name: "Apply in settings dialog"
      platforms: ["mac"]
      action:
        type: key
        value: default
        wait_time: 2
    - name: "Close Setting Dialog"
      platforms: ["mac"]
      action:
        type: shortcut
        value: Close Dialog
    
    - name: "End meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2

    - name: "End meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2

#Start meeting
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true
    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5

    # Add bot
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join bts13@converged-bts.webex.com audio=off video=on with 1 ucf_api duration 15"
          duration: 120
      expect_state: ""

    - name: "change case name for telegraf"
      action:
        type: function
        value: replace_txt_file
        parameters:
          file_path: "~/Desktop/teamsCallingCpuMonitor_caseName.txt"
          content: "vBGTest"
      expect_state: ""
    
    # start telegraf
    - name: "open local background process and run command"
      action:
        type: function
        value: open_background_process_and_run_command
        parameters:
          command: "telegraf -config ~/telegraf.conf"
        save_to: terminal_session_id
      expect_state: ""

    # - name: "connect_webex_meeting_main_window"
    #   action:
    #     type: function
    #     value: connect_webex_meeting_main_window
    #     parameters:
    #       ctrl_id: "CallWindowDialog"

    - name: "Wait exactly 360 seconds"
      action:
        type: function
        value: ui_element_wait_time
        parameters:
          seconds: 360
      expect_state: ""

    # end telegraf
    - name: "close background process"
      action:
        type: function
        value: close_background_process_session
        parameters:
          session_id: "${terminal_session_id}"

    - name: "restore case name for telegraf"
      action:
        type: function
        value: replace_txt_file
        parameters:
          file_path: "~/Desktop/teamsCallingCpuMonitor_caseName.txt"
          content: "Default"
      expect_state: ""

    - name: "Leave meeting or end meeting for everyone"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""

  post_conditions:
     - navigations/basic/sign_out
     - navigations/basic/quit_app

  execution_duration: 1
  execution_count: 1
  check_points: ["Keyboard Navigation", "Performance"]

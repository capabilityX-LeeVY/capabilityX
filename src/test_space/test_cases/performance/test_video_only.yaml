test_case:
  name: performance_video_only_test
  owner: huanwan3
  account: bts13
  description: Performance test for video-only meeting - tests meeting with video enabled and audio disabled
  expect_result: Successfully starts meeting with video only, measures performance metrics
  pre_conditions:
    - navigations/basic/sign_in
    # start telegraf
    - meetings/actions/pmr_setup

  steps:
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""

    # Video only setup - mute audio, enable video
    - name: "Mute before meeting"
      action:
        type: function
        value: ensure_muted_before_meeting
      expect_state: ""
    
    - name: "Start video before meeting"
      action:
        type: function
        value: ensure_video_on_before_meeting
      expect_state: ""
    
    # Start PMR meeting
    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
    
    # End meeting for all
    - name: End meeting
      action:
        type: key
        value: default
      expect_state: "End meeting, Menu item"

    - name: End meeting, Menu item
      action:
        type: key
        value: default
      expect_state: ""

    # Start PMR meeting again
    - name: "Meetings menu item"
      action:
        type: key
        value: default
      expect_state: ""
    
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      expect_state: ""
    
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""

    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5

    # Performance measurement
    - name: "Wait exactly 60 seconds"
      action:
        type: function
        value: wait_seconds
        parameters:
          seconds: 60
      expect_state: ""

  post_conditions:
    - meetings/actions/end_meeting_for_all
    - navigations/basic/sign_out
    # end telegraf
  execution_duration: 1
  execution_count: 1
  check_points: [Keyboard Navigation, Performance]

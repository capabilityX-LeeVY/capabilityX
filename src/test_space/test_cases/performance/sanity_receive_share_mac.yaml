test_case:
  name: sanity_receive_share_mac
  owner: gamao
  account: bts13
  description: Performance test for receive sharing in meeting - tests meeting with audio disabled and video disabled
  expect_result: Successfully starts meeting receiving sharing with audio disabled and video disabled, measures performance metrics
  pre_conditions:
     - navigations/basic/re-install_app
    # - navigations/basic/agree
     - navigations/basic/sign_in
    
  steps: 
  # setup pmr
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true

    - name: "Mute"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true
    - name: "Stop video"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true

    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5
    
    - name: "End meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2

    - name: "End meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2

#Start meeting
    - name: "More options for starting a Webex meeting"
      action:
        type: key
        value: default
      expect_state: ""
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""
    - name: "Accept"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
      optional: true
    - name: "Start meeting"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 5

    # Add bot
    - name: "add bot to meeting"
      action:
        type: function
        value: send_stress_message_to_webex
        parameters:
          markdown_message: "<@personEmail:awebexbot@webex.bot> join bts13@converged-bts.webex.com audio=off video=off sharing=desktop with 1 ucf_api duration 15"
          duration: 120
      expect_state: ""

    - name: "change case name for telegraf"
      action:
        type: function
        value: replace_txt_file
        parameters:
          file_path: "~/Desktop/teamsCallingCpuMonitor_caseName.txt"
          content: "receiveShareTest"
      expect_state: ""
    
    # start telegraf
    - name: "open local background process and run command"
      action:
        type: function
        value: open_background_process_and_run_command
        parameters:
          command: "telegraf -config ~/telegraf.conf"
        save_to: terminal_session_id
      expect_state: ""

    # - name: "connect_webex_meeting_main_window"
    #   action:
    #     type: function
    #     value: connect_webex_meeting_main_window
    #     parameters:
    #       ctrl_id: "CallWindowDialog"

    - name: "Wait exactly 360 seconds"
      action:
        type: function
        value: ui_element_wait_time
        parameters:
          seconds: 360
      expect_state: ""

    # end telegraf
    - name: "close background process"
      action:
        type: function
        value: close_background_process_session
        parameters:
          session_id: "${terminal_session_id}"

    - name: "restore case name for telegraf"
      action:
        type: function
        value: replace_txt_file
        parameters:
          file_path: "~/Desktop/teamsCallingCpuMonitor_caseName.txt"
          content: "Default"
      expect_state: ""

    - name: "Leave meeting or end meeting for everyone"
      action:
        type: key
        value: default
      expect_state: ""
      wait_time: 2
    - name: "Direct Arrow Down Key Press"
      action:
        type: direct_key
        value: down
      expect_state: ""
    - name: "Direct Enter Key Press"
      action:
        type: direct_key
        value: enter
      wait_time: 3
      expect_state: ""

  post_conditions:
     - navigations/basic/sign_out
     - navigations/basic/quit_app

  execution_duration: 1
  execution_count: 1
  check_points: ["Keyboard Navigation", "Performance"]

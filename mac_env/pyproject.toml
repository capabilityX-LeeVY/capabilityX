[project]
name = "webex-regress-shield-mac"
version = "0.1.0"
description = "Mac environment for webex-regress-shield (Python 3.9.6)"
readme = "../README.md"
requires-python = "==3.9.6"
dependencies = [
    "celery>=5.4.0",
    "cryptography>=38.0.0",
    # django 5.x requires Python>=3.10; use 4.2 LTS for Python 3.9
    "django>=4.2,<5.0",
    "jira>=3.5.0",
    "markdown>=3.4.0",
    "matplotlib>=3.6.0",
    "mss>=7.0.0",
    "openai>=1.0.0",
    "opencv-python==4.12.0.88",
    "openpyxl>=3.0.10",
    "packaging>=23.0",
    "pandas>=1.5.0",
    "paramiko==3.5.1",
    "psutil>=5.9.0",
    "pyautogui>=0.9.54",
    "pymysql>=1.0.3",
    "pytesseract>=0.3.10",
    "pyobjc>=9.0",
    "pynput>=1.7.0",
    # numpy 2.0.x supports Python 3.9; required by opencv-python 4.12.0.88
    "numpy>=2.0,<2.1",
    "schedule>=1.2.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "imagehash==4.3.2",
    "cython>=3.0.0",
    "setuptools>=65.0.0",
]
